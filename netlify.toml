# ──────────────────────────────────────────────────────────────
# Pixel & Purpose — Netlify Build Configuration
# Deploys as a Next.js static export (output: 'export')
# ──────────────────────────────────────────────────────────────

[build]
  # Static export lands in /out — matches next.config.ts `output: 'export'`
  publish = "out"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  # ──────────────────────────────────────────────────────────────
  # ⚠️  Do NOT put EmailJS keys here — add them in:
  #    Netlify Dashboard → Site Settings → Environment Variables
  #
  #    Required variables:
  #      NEXT_PUBLIC_EMAILJS_SERVICE_ID
  #      NEXT_PUBLIC_EMAILJS_TEMPLATE_ID
  #      NEXT_PUBLIC_EMAILJS_PUBLIC_KEY
  #
  #    See .env.local.example for setup instructions.
  # ──────────────────────────────────────────────────────────────

# Static file headers for performance & security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Clean URL routing — Next.js with trailingSlash:true generates
# /about/index.html so no catch-all redirect is needed.
# This 404 redirect keeps direct deep-links working on Netlify.
[[redirects]]
  from   = "/index.html"
  to     = "/"
  status = 301
  force  = true
